[project]
name = "trustlayer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aquib Ahmad", email = "180749490+aquib-github@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "google-generativeai>=0.8.6",
    "greenlet>=3.5.6",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.32.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trustlayer = "trustlayer:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
